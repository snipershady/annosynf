framework:
    cache:
        # Spazio dei nomi stabile delle chiavi, condiviso da web e worker anche su host diversi.
        prefix_seed: snipershady/annosynf

        # §B.5.3: cache.app su Redis (statistiche, confronti, soluzioni ALTCHA già usate, ecc.).
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'

when@test:
    framework:
        cache:
            # I test non dipendono da Redis. Non "array": il client di test azzera i servizi
            # resettabili a ogni richiesta e si perderebbero rate limiter e soluzioni ALTCHA già usate.
            app: cache.adapter.filesystem
