framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            # Import delle release: nessun nuovo tentativo automatico, perché un task fallito segna la release come
            # failed e si riprende con annosynf:release:retry (un task può durare ore).
            import:
                dsn: '%env(MESSENGER_IMPORT_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 0
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            # Le e-mail dell'account partono in modo sincrono: non richiedono un worker attivo.
            #Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            App\Message\RunReleaseTask: import
