doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        charset: utf8mb4
        default_table_options:
            charset: utf8mb4
            collate: utf8mb4_0900_ai_ci

        profiling_collect_backtrace: '%kernel.debug%'
        # Le tabelle ref_* sono partizionate per release (CLAUDE.md §B.4.2): Doctrine non esprime il partizionamento,
        # quindi le gestiscono migration con SQL esplicito e restano fuori dal confronto con i metadati.
        schema_filter: ~^(?!ref_)~
        # LOAD DATA LOCAL INFILE (MysqlLoadDataBulkLoader) solo dai file in questa directory. ATTR_LOCAL_INFILE resta
        # spento di proposito: acceso, mysqlnd permetterebbe al server di leggere qualunque file del client.
        options:
            !php/const Pdo\Mysql::ATTR_LOCAL_INFILE_DIRECTORY: '%annosynf.bulk_dir%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
